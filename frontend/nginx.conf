# frontend/nginx.conf
#
# try_files 那行是关键——react-router-dom 是客户端路由，用户直接刷新
# /course-designer 这种网址、或者手机浏览器直接打开这个链接的时候，
# 是浏览器直接问 nginx 要 /course-designer 这个路径，nginx 本身并不知道
# 这个路径，没有这行会直接 404。加了这行，nginx 找不到对应的文件/目录
# 时，会退回给 index.html，剩下的路由交给前端的 react-router 自己处理。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源（JS/CSS/图片这些build出来的带hash文件名的）缓存久一点，
  # index.html 本身不缓存（不然发新版本，用户浏览器还在用旧的index.html
  # 指向已经被替换掉的旧JS文件）
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
